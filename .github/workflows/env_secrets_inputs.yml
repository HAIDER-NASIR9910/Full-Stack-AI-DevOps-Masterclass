name: Demo ci Env secrets inputs artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Install
        env:
          App_Env: demo
          DB_Pass: ${{ secrets.DB_PASSWORD }}
        run: echo Environment ${App_Env} and DB Password ${DB_Pass}
      - name: Create Demo file
        run: echo "This is a demo file" > demo.txt
      - name: Upload Demo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: .