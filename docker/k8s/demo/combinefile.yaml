apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: nginx
        image: my-app:2.0
        env:
          - name: ENVIRONMENT
            value: "production"
          - name: DB_PASSWORD
            value: "password"
        ports:
        - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: my-app
spec:
  type: NodePort
  selector:
    app: my-app
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080