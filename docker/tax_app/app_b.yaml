# app_b.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-service-b
  labels:
    app: tax-service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-service-b
  template:
    metadata:
      labels:
        app: tax-service-b
    spec:
      containers:
        - name: tax-service-b
          image: embarkx/tax-service-b
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: tax-service-b
spec:
  selector:
    app: tax-service-b
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP