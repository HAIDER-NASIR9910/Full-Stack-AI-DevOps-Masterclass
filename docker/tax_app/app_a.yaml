# app_a.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-service-a
  labels:
    app: tax-service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-service-a
  template:
    metadata:
      labels:
        app: tax-service-a
    spec:
      containers:
        - name: tax-service-a
          image: embarkx/tax-service-a
          ports:
            - containerPort: 3000
          env:
            - name: SERVICE_B_URL
              value: "http://tax-service-b:4000"
---
apiVersion: v1
kind: Service
metadata:
  name: tax-service-a
spec:
  selector:
    app: tax-service-a
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  type: NodePort